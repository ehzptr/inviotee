<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anindya &amp; Raka — Undangan Pernikahan</title>
<meta name="description" content="Kami mengundang Anda ke pernikahan Anindya & Raka, Sabtu 20 Desember 2026.">
<meta property="og:title" content="Anindya & Raka — Undangan Pernikahan">
<meta property="og:description" content="Sabtu, 20 Desember 2026. Buka undangan dan konfirmasi kehadiran Anda.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2b2142">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--
=====================================================================
 SCAFFOLD UNDANGAN PERNIKAHAN — satu file, tanpa build
=====================================================================
 File ini terdiri dari tiga lapisan yang terpisah:

   1. KONTEN   (const INVITATION)  nama, tanggal, lokasi, teks. Satu per pelanggan.
   2. TEMA     (const THEMES)      warna, font, bentuk, ornamen. Satu per gaya.
   3. ENGINE   (bagian SCAFFOLD)   struktur, animasi, RSVP. Tidak perlu diubah.

 Ganti tema:   buka dengan ?theme=fajar | java | bali
 Pratinjau:    tambahkan &dock untuk tombol pengganti tema
 Nama tamu:    ?to=Nama+Tamu

 KONTRAK TEMA (semua bagian halaman hanya membaca ini)
 ---------------------------------------------------------------------
 id, name
 fonts   { href, display, body }
 tokens  CSS variable bentuk & gaya:
           --display-weight --display-tracking --display-case --em-style
           --radius-card --radius-btn
           --frame-radius --frame-radius-alt --frame-clip --frame-clip-alt
           --motif-opacity --motif-size
           --hero-name-size --hero-amp-size
           --gate-bg --gate-ink
 surfaces  { hero, couple, story, event, place, gallery, rsvp, close }
           masing-masing { bg, ink, accent }. Warna berganti halus saat
           bagian itu masuk layar. Pastikan ink/bg minimal kontras 4.5:1.
 motif   string SVG (garis hitam, tanpa warna) untuk pola latar halus
 photos  array palet [langit, tanah, siluet] untuk foto placeholder
 css     CSS tambahan khusus tema (kelas ornamen)
 art     { hero, close }  string HTML/SVG berisi layer ornamen.
         Setiap layer adalah elemen dengan class "layer" dan boleh memakai:
           data-y="dari,ke"      geser vertikal  (% tinggi layer)
           data-x="dari,ke"      geser horizontal (% lebar layer)
           data-scale="dari,ke"  skala
           data-rot="dari,ke"    rotasi derajat
         Layer dianimasikan mengikuti scroll. Teks hero berada di atas art,
         jadi pastikan art tidak menurunkan kontras teks.
 Untuk membuat tema baru: salin salah satu objek di THEMES, ganti isinya.
=====================================================================
-->
<style>
:root{
  /* diisi oleh tema */
  --bg:#2b2142; --ink:#fbeedd; --accent:#ffb07a;
  --display:Georgia,"Times New Roman",serif;
  --body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --display-weight:300; --display-tracking:-.025em; --display-case:none; --em-style:italic;
  --radius-card:28px; --radius-btn:999px;
  --frame-radius:999px 999px 24px 24px; --frame-radius-alt:24px; --frame-clip:none; --frame-clip-alt:none;
  --motif:none; --motif-opacity:.06; --motif-size:88px;
  --hero-name-size:clamp(68px,19vw,270px); --hero-amp-size:clamp(40px,8vw,110px);
  --gate-bg:#12162c; --gate-ink:#f3e9dc;

  /* turunan */
  --muted:color-mix(in srgb,var(--ink) 70%,transparent);
  --line:color-mix(in srgb,var(--ink) 16%,transparent);
  --card:color-mix(in srgb,var(--ink) 6%,transparent);
  --gutter:max(clamp(20px,5vw,72px),env(safe-area-inset-left),env(safe-area-inset-right));
  --section-y:clamp(96px,12vw,180px);
  --label:.75rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(1rem,.5vw + .8125rem,1.125rem);line-height:1.65;overflow-x:clip;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* theme motif */
.motif{position:relative;isolation:isolate}
.motif::before,.gate .door::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--ink);opacity:var(--motif-opacity);
  -webkit-mask:var(--motif) 0 0/var(--motif-size) auto;mask:var(--motif) 0 0/var(--motif-size) auto}
.gate .door::after{z-index:0;background:var(--gate-ink);opacity:.06}

main,.hud{position:relative;z-index:1}

/* HUD */
.hud{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;justify-content:space-between;align-items:center;
  padding:clamp(14px,2vw,24px) var(--gutter) clamp(14px,2vw,22px);pointer-events:none;font-size:var(--label);letter-spacing:.2em;text-transform:uppercase;font-weight:600;
  opacity:0;transition:opacity .8s .5s}
html:not(.locked) .hud{opacity:1}
.hud .mark{font-family:var(--display);font-weight:var(--display-weight);font-size:18px;letter-spacing:.04em;text-transform:none}
.hud .sec{display:flex;gap:14px;align-items:center;color:var(--muted)}
.hud .sec b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.hud .bar{position:absolute;left:var(--gutter);right:var(--gutter);bottom:0;height:1px;background:var(--line)}
.hud .bar i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}

/* gate */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;color:var(--gate-ink);padding:var(--gutter)}
.gate .door{position:absolute;top:0;bottom:0;width:50.2%;background:var(--gate-bg);overflow:hidden}
.gate .door.l{left:0}.gate .door.r{right:0}
.gate-in{position:relative;display:grid;gap:clamp(16px,2.6vh,28px);justify-items:center;max-width:540px}
.gate .eyebrow{justify-content:center;color:color-mix(in srgb,var(--gate-ink) 70%,transparent)}
.gate .eyebrow::before{display:none}
.gate h1{font-family:var(--display);font-weight:var(--display-weight);text-transform:var(--display-case);letter-spacing:var(--display-tracking);font-size:clamp(42px,10vw,88px);line-height:.98}
.gate h1 em{display:block;font-style:var(--em-style);font-size:.4em;color:var(--gate-accent,var(--accent));margin:.14em 0}
.gate .to{font-size:14px;color:color-mix(in srgb,var(--gate-ink) 72%,transparent);line-height:1.5}
.gate .to b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(22px,4vw,30px);color:var(--gate-ink);margin-top:4px}
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:.75em;padding:.95em 1.7em;border-radius:var(--radius-btn);
  background:var(--ink);color:var(--bg);font-weight:600;font-size:.9em;letter-spacing:.04em;text-decoration:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
@media (hover:hover){.btn:hover{transform:translateY(-2px)}}
.btn:active{transform:none}
.btn svg{width:1em;height:1em;transition:transform .3s}
@media (hover:hover){.btn:hover svg{transform:translateX(3px)}}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
@media (hover:hover){.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--ink)}}
.gate .btn{background:var(--gate-ink);color:var(--gate-bg)}

/* shared section parts */
section{position:relative}
.wrap{width:min(1200px,100%);margin-inline:auto;padding-inline:var(--gutter)}
.eyebrow{font-size:var(--label);letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:32px;height:1px;background:currentColor}
.display{font-family:var(--display);font-weight:var(--display-weight);letter-spacing:var(--display-tracking);text-transform:var(--display-case);line-height:1.02}
.display em{font-style:var(--em-style);color:var(--accent)}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em}
.c{display:inline-block}
.lead{font-size:clamp(1rem,1vw + .75rem,1.25rem);color:var(--muted);max-width:36em}
.head{display:grid;gap:22px;max-width:820px}
.head .display{font-size:clamp(36px,5.6vw,80px)}
.art{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.layer{position:absolute;inset:0;will-change:transform}

/* hero */
#hero{height:100svh;min-height:620px;overflow:hidden;display:grid;place-items:center}
#hero-art{z-index:1}
.hero-top,.hero-date{text-shadow:0 1px 14px rgba(0,0,0,.35)}
.hero-top{position:absolute;z-index:3;top:clamp(84px,13vh,130px);left:0;right:0;text-align:center;font-size:var(--label);letter-spacing:.34em;text-transform:uppercase;font-weight:600;color:var(--ink)}
.hero-names{position:relative;z-index:3;width:min(1200px,100%);padding-inline:var(--gutter);margin-top:-6vh;font-family:var(--display);font-weight:var(--display-weight);text-transform:var(--display-case);letter-spacing:var(--display-tracking);line-height:.84}
.hero-names .row{display:block;font-size:var(--hero-name-size)}
.hero-names .a{text-align:left}
.hero-names .amp{font-style:var(--em-style);color:var(--accent);font-size:var(--hero-amp-size);text-align:center;margin:-.1em 0 -.05em;letter-spacing:0}
.hero-names .b{text-align:right}
.hero-date{position:absolute;z-index:3;left:0;right:0;bottom:clamp(112px,20vh,210px);text-align:center;font-family:var(--display);font-size:clamp(18px,2.2vw,28px);font-weight:400}
.hero-date .v{display:block;font-family:var(--body);font-size:var(--label);letter-spacing:.3em;text-transform:uppercase;font-weight:600;margin-top:10px}
.cue{position:absolute;z-index:3;bottom:20px;left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:8px;font-size:var(--label);letter-spacing:.32em;text-transform:uppercase;font-weight:600}
.cue i{width:1px;height:40px;background:linear-gradient(var(--ink),transparent)}

/* couple */
#couple{padding:var(--section-y) 0}
#couple .head{margin-bottom:clamp(56px,8vw,110px)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(14px,4vw,64px);align-items:center}
.person{display:grid;gap:22px;justify-items:center;text-align:center}
.person.r{margin-top:clamp(40px,9vw,140px)}
.photo{position:relative;overflow:hidden;background:var(--card);isolation:isolate}
.photo svg,.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.arch{width:min(100%,380px);aspect-ratio:3/4;border-radius:var(--frame-radius);clip-path:var(--frame-clip)}
.person h3{font-family:var(--display);font-weight:var(--display-weight);text-transform:var(--display-case);letter-spacing:var(--display-tracking);font-size:clamp(22px,2.8vw,38px);line-height:1.08}
.person p{color:var(--muted);font-size:.92em;max-width:22em}
.bond{width:clamp(50px,10vw,150px)}
.bond svg{width:100%;overflow:visible}

/* story */
#story{height:100svh;min-height:600px;overflow:hidden}
.pin-in{height:100%;overflow:hidden}
.track{position:relative;will-change:transform;display:flex;gap:clamp(24px,6vw,100px);height:100%;width:max-content;padding:22svh var(--gutter) 0;align-items:flex-start}
.track .line{position:absolute;left:0;right:0;top:calc(22svh + 8px);height:2px;background:var(--line)}
.track .line i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.intro-panel{flex:0 0 min(86vw,560px);display:grid;gap:22px;align-content:start;padding-top:48px}
.panel{flex:0 0 min(82vw,500px);display:grid;gap:14px;align-content:start}
.node{width:18px;height:18px;border-radius:50%;background:var(--accent);outline:6px solid color-mix(in srgb,var(--accent) 22%,transparent);transform:scale(.4);opacity:.35;transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .4s}
.panel.on .node{transform:scale(1);opacity:1}
.yr{font-family:var(--display);font-weight:var(--display-weight);font-size:clamp(80px,13vw,180px);line-height:.9;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--ink) 55%,transparent);margin-top:18px;transition:color .6s}
.panel.on .yr{color:color-mix(in srgb,var(--accent) 24%,transparent)}
.panel h3{font-family:var(--display);font-weight:var(--display-weight);text-transform:var(--display-case);letter-spacing:var(--display-tracking);font-size:clamp(24px,3vw,40px);line-height:1.08;margin-top:-.7em;position:relative}
.panel p{color:var(--muted);max-width:30em;position:relative}
.panel>*:not(.node){opacity:.8;transition:opacity .6s}
.panel.on>*{opacity:1}

/* event */
#event{padding:var(--section-y) 0}
#event .head{margin-bottom:clamp(40px,6vw,80px)}
.date-big{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.4vw,32px)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(14px,2vw,28px)}
.ecard{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-card);padding:clamp(24px,3.4vw,48px);display:grid;gap:18px;align-content:start}
.ecard .tag{font-size:var(--label);letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:700}
.ecard .time{font-family:var(--display);font-weight:var(--display-weight);font-size:clamp(44px,6.4vw,92px);letter-spacing:-.03em;line-height:.92}
.ecard .time small{font-family:var(--body);font-size:12px;letter-spacing:.16em;margin-left:.8em;color:var(--muted);font-weight:600}
.ecard p{color:var(--muted)}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,24px);margin-top:clamp(40px,6vw,80px);text-align:center}
.count div{padding:clamp(16px,2.4vw,30px) 8px 0;border-top:1px solid var(--ink)}
.count b{display:block;font-family:var(--display);font-weight:var(--display-weight);font-size:clamp(38px,7.4vw,104px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.count span{font-size:var(--label);letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}

/* place */
#place{padding:var(--section-y) 0}
.place-grid{display:grid;grid-template-columns:5fr 7fr;gap:clamp(30px,6vw,100px);align-items:center}
.place-copy{display:grid;gap:24px}
.place-copy .display{font-size:clamp(34px,5vw,70px)}
.addr{font-style:normal;color:var(--muted);border-left:2px solid var(--accent);padding-left:18px}
.addr b{display:block;color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.3em;line-height:1.2;margin-bottom:4px}
.map{border:1px solid var(--line);border-radius:var(--radius-card);background:var(--card);overflow:hidden;aspect-ratio:6/4.4}
.map svg{width:100%;height:100%}
.map .blk{fill:color-mix(in srgb,var(--ink) 9%,transparent)}
.map .rd{stroke:color-mix(in srgb,var(--ink) 22%,transparent);fill:none;stroke-width:6;stroke-linecap:round}
.map .route{stroke:var(--accent);fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.map .pin{fill:var(--accent)}
.map .pin-dot{fill:var(--bg)}
.map .ring{fill:none;stroke:var(--accent);stroke-width:2}
.map text{font-family:var(--body);font-size:12px;letter-spacing:.14em;fill:var(--muted);text-transform:uppercase}
.status{font-size:13px;color:var(--accent);min-height:1.4em}

/* gallery */
#gallery{padding:var(--section-y) 0;overflow:hidden}
#gallery .head{margin-bottom:clamp(40px,6vw,90px)}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2.4vw,36px);align-items:start}
.gcol{display:grid;gap:clamp(12px,2.4vw,36px)}
.gcol:nth-child(2){margin-top:clamp(40px,8vw,120px)}
.frame{display:grid;gap:10px}
.frame .photo{aspect-ratio:3/4;border-radius:var(--frame-radius-alt);clip-path:var(--frame-clip-alt)}
.frame.alt .photo{border-radius:var(--frame-radius);clip-path:var(--frame-clip)}
.frame.tall .photo{aspect-ratio:3/4.6}
.frame figcaption{font-size:var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px;font-weight:600}

/* rsvp */
#rsvp{padding:var(--section-y) 0}
.rsvp-grid{display:grid;grid-template-columns:6fr 5fr;gap:clamp(30px,6vw,100px);align-items:start}
.rsvp-head{margin-bottom:34px}
form{display:grid;gap:22px}
.field{display:grid;gap:8px}
label,legend{font-size:var(--label);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:700}
fieldset{border:0;display:grid;gap:8px}
input[type=text],select,textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:.7em 0;font-size:max(16px,1.05em);border-radius:0;transition:border-color .3s}
select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select option{color:#111;background:#fff}
textarea{min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:calc(var(--radius-card)*.6);padding:.9em 1em}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
::placeholder{color:color-mix(in srgb,var(--ink) 60%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 1.2em;border-radius:var(--radius-btn);box-shadow:inset 0 0 0 1px var(--line);font-size:.92em;letter-spacing:0;text-transform:none;color:var(--ink);transition:all .25s;font-weight:500}
.chip input:checked+span{background:var(--ink);color:var(--bg);box-shadow:none}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.err{color:color-mix(in srgb,var(--accent) 70%,var(--ink));font-size:13px;min-height:1.2em}
.thanks{display:none;border:1px solid var(--line);border-radius:var(--radius-card);padding:clamp(26px,4vw,48px);background:var(--card);gap:12px}
.thanks h3{font-family:var(--display);font-weight:var(--display-weight);text-transform:var(--display-case);font-size:clamp(28px,3.6vw,48px);line-height:1.05}
.thanks p{color:var(--muted)}
.wishes{display:grid;gap:14px}
.stats{display:flex;gap:28px;margin-bottom:6px;flex-wrap:wrap}
.stats div{font-size:var(--label);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats b{display:block;font-family:var(--display);font-weight:var(--display-weight);font-size:44px;letter-spacing:-.02em;color:var(--ink);line-height:1}
.wlist{display:grid;gap:12px;max-height:520px;overflow:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.wish{border:1px solid var(--line);background:var(--card);border-radius:calc(var(--radius-card)*.7);padding:16px 18px}
.wish b{font-family:var(--display);font-weight:400;font-size:1.12em;display:flex;justify-content:space-between;gap:10px}
.wish b em{font-family:var(--body);font-style:normal;font-size:var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;padding-top:.6em}
.wish p{color:var(--muted);font-size:.95em;margin-top:4px}

/* close */
#close{min-height:100svh;display:grid;place-items:center;text-align:center;padding:var(--section-y) 0 max(56px,env(safe-area-inset-bottom));overflow:hidden}
#close-art{z-index:0}
.close-in{position:relative;z-index:1;display:grid;gap:26px;justify-items:center}
.close-in .display{font-size:clamp(44px,9vw,136px)}
.close-in p{max-width:32em;color:var(--muted)}
.hash{font-family:var(--display);font-size:clamp(18px,2vw,26px);color:var(--accent);letter-spacing:.04em}
.foot{margin-top:clamp(56px,8vw,110px);font-size:var(--label);letter-spacing:.26em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* theme dock (?dock) */
.dock{position:fixed;left:14px;bottom:14px;z-index:90;display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(10,10,10,.82);backdrop-filter:blur(8px);font:600 11px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.dock a{color:#ddd;text-decoration:none;padding:9px 14px;border-radius:999px}
.dock a[aria-current]{background:#f2f2f2;color:#111}

@media (max-width:860px){
  .pair{grid-template-columns:1fr 1fr}.bond{display:none}
  .place-grid,.rsvp-grid{grid-template-columns:1fr}

<body>

<header class="hud" aria-hidden="true">
  <div class="mark" id="mark"></div>
  <div class="sec"><b id="sec-i">01</b><span id="sec-n"></span></div>
  <div class="bar"><i id="bar"></i></div>
</header>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="door l"></div><div class="door r"></div>
  <div class="gate-in">
    <div class="eyebrow" data-bind="gate.eyebrow"></div>
    <h1 id="gate-title"><span data-bind="couple.a.first"></span><em data-bind="hero.joiner"></em><span data-bind="couple.b.first"></span></h1>
    <p class="to"><span data-bind="gate.to"></span><b id="guest" data-bind="gate.guest"></b></p>
    <button class="btn" id="open" type="button"><span data-bind="gate.open"></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg></button>
  </div>
</div>

<main id="top">

  <section id="hero" data-surface="hero" aria-label="Sampul">
    <div class="art" id="hero-art" aria-hidden="true"></div>
    <div class="hero-top" data-hero="fade" data-bind="hero.eyebrow"></div>
    <h2 class="hero-names" aria-label="">
      <span class="row a" data-hero="split" data-bind="couple.a.first"></span>
      <span class="row amp" data-hero="split" data-bind="hero.joiner"></span>
      <span class="row b" data-hero="split" data-bind="couple.b.first"></span>
    </h2>
    <div class="hero-date" id="hero-date"><span data-bind="date.label"></span><span class="v" data-bind="hero.venueLine"></span></div>
    <div class="cue" data-hero="fade"><span data-bind="hero.scroll"></span><i></i></div>
  </section>

  <section id="couple" class="motif" data-surface="couple">
    <div class="wrap">
      <div class="head">
        <div class="eyebrow" data-rise data-bind="intro.eyebrow"></div>
        <h2 class="display" data-split data-rich data-bind="intro.title"></h2>
        <p class="lead" data-rise data-bind="intro.text"></p>
      </div>
      <div class="pair">
        <article class="person l">
          <div class="photo arch p-left" data-portrait="0" role="img" data-bind-attr="aria-label:couple.a.full"></div>
          <h3 data-bind="couple.a.full"></h3>
          <p data-bind="couple.a.parents"></p>
        </article>
        <div class="bond" aria-hidden="true">
          <svg viewBox="0 0 150 60"><path id="bond-path" d="M2 30 C30 -10 50 70 75 30 S120 -10 148 30" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/></svg>
        </div>
        <article class="person r">
          <div class="photo arch p-right" data-portrait="1" role="img" data-bind-attr="aria-label:couple.b.full"></div>
          <h3 data-bind="couple.b.full"></h3>
          <p data-bind="couple.b.parents"></p>
        </article>
      </div>
    </div>
  </section>

  <section id="story" data-surface="story" aria-label="Kisah">
    <div class="pin-in">
      <div class="track" id="track">
        <div class="line" aria-hidden="true"><i id="line-fill"></i></div>
        <div class="intro-panel">
          <div class="eyebrow" data-bind="story.eyebrow"></div>
          <h2 class="display" data-rich data-bind="story.title" style="font-size:clamp(38px,5.6vw,80px)"></h2>
          <p class="lead" data-bind="story.lead"></p>
        </div>
        <div id="panels" style="display:contents"></div>
        <div style="flex:0 0 8vw" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <section id="event" class="motif" data-surface="event">
    <div class="wrap">
      <div class="head">
        <div class="eyebrow" data-rise data-bind="event.eyebrow"></div>
        <h2 class="display" data-split data-rich data-bind="event.title"></h2>
        <p class="date-big" data-rise data-bind="date.label"></p>
      </div>
      <div class="cards" id="cards"></div>
      <div class="count" id="count" role="timer">
        <div><b id="cd-d">00</b><span data-bind="event.cd.d"></span></div>
        <div><b id="cd-h">00</b><span data-bind="event.cd.h"></span></div>
        <div><b id="cd-m">00</b><span data-bind="event.cd.m"></span></div>
        <div><b id="cd-s">00</b><span data-bind="event.cd.s"></span></div>
      </div>
      <div class="actions" data-rise><button class="btn ghost" id="ics" type="button" data-bind="event.calendar"></button></div>
    </div>
  </section>

  <section id="place" data-surface="place">
    <div class="wrap place-grid">
      <div class="place-copy">
        <div class="eyebrow" data-rise data-bind="place.eyebrow"></div>
        <h2 class="display" data-split data-rich data-bind="place.title"></h2>
        <address class="addr" data-rise><b data-bind="place.name"></b><span data-bind="place.address"></span></address>
        <div class="actions" data-rise style="margin-top:0">
          <a class="btn" id="maps" target="_blank" rel="noopener" href="#"><span data-bind="place.maps"></span></a>
          <button class="btn ghost" id="copy" type="button" data-bind="place.copy"></button>
        </div>
        <div class="status" id="copied" role="status" aria-live="polite"></div>
      </div>
      <div class="map" role="img" data-bind-attr="aria-label:place.mapLabel">
        <svg viewBox="0 0 600 440">
          <rect class="blk" x="30" y="30" width="150" height="110" rx="12"/><rect class="blk" x="210" y="30" width="120" height="70" rx="12"/>
          <rect class="blk" x="360" y="30" width="200" height="120" rx="12"/><rect class="blk" x="30" y="170" width="110" height="130" rx="12"/>
          <rect class="blk" x="170" y="140" width="140" height="150" rx="12"/><rect class="blk" x="340" y="190" width="100" height="100" rx="12"/>
          <rect class="blk" x="470" y="190" width="90" height="100" rx="12"/><rect class="blk" x="30" y="330" width="200" height="80" rx="12"/>
          <rect class="blk" x="260" y="320" width="150" height="90" rx="12"/><rect class="blk" x="440" y="320" width="120" height="90" rx="12"/>
          <path class="rd" d="M0 155 H600 M195 0 V440 M345 0 V440 M0 310 H600 M455 0 V440"/>
          <path class="route" id="route" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" d="M195 440 V310 H345 V155 H455 V100"/>
          <text x="206" y="428" data-bind="place.entry"></text>
          <g id="pin" transform="translate(455 100)">
            <circle class="ring" id="ring" r="14" opacity="0"/>
            <path class="pin" d="M0 0 C-16 -22 -22 -34 -22 -44 a22 22 0 1 1 44 0 C22 -34 16 -22 0 0Z"/>
            <circle class="pin-dot" cy="-44" r="8"/>
          </g>
        </svg>
      </div>
    </div>
  </section>

  <section id="gallery" class="motif" data-surface="gallery">
    <div class="wrap">
      <div class="head">
        <div class="eyebrow" data-rise data-bind="gallery.eyebrow"></div>
        <h2 class="display" data-split data-rich data-bind="gallery.title"></h2>
      </div>
      <div class="gal-grid" id="gal"></div>
    </div>
  </section>

  <section id="rsvp" data-surface="rsvp">
    <div class="wrap rsvp-grid">
      <div>
        <div class="head rsvp-head">
          <div class="eyebrow" data-rise data-bind="rsvp.eyebrow"></div>
          <h2 class="display" data-split data-rich data-bind="rsvp.title"></h2>
          <p class="lead" data-rise data-bind="rsvp.text"></p>
        </div>
        <form id="rsvp-form" novalidate data-rise>
          <div class="field"><label for="f-name" data-bind="rsvp.nameLabel"></label><input id="f-name" name="name" type="text" autocomplete="name" maxlength="60" data-bind-attr="placeholder:rsvp.namePh" required></div>
          <fieldset><legend data-bind="rsvp.attLabel"></legend>
            <div class="chips">
              <label class="chip"><input type="radio" name="att" value="yes"><span data-bind="rsvp.att.yes"></span></label>
              <label class="chip"><input type="radio" name="att" value="no"><span data-bind="rsvp.att.no"></span></label>
              <label class="chip"><input type="radio" name="att" value="maybe"><span data-bind="rsvp.att.maybe"></span></label>
            </div>
          </fieldset>
          <div class="field" id="guest-field"><label for="f-count" data-bind="rsvp.countLabel"></label><select id="f-count" name="count"></select></div>
          <div class="field"><label for="f-msg" data-bind="rsvp.msgLabel"></label><textarea id="f-msg" name="msg" maxlength="280" data-bind-attr="placeholder:rsvp.msgPh"></textarea></div>
          <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="err" id="err" role="alert"></div>
          <div><button class="btn" type="submit" data-bind="rsvp.submit"></button></div>
        </form>
        <div class="thanks" id="thanks" role="status"><h3><span data-bind="rsvp.thanks"></span> <span id="t-name"></span>.</h3><p id="t-text"></p></div>
      </div>
      <div class="wishes" data-rise>
        <div class="stats">
          <div><b id="s-yes">0</b><span data-bind="rsvp.att.yes"></span></div>
          <div><b id="s-no">0</b><span data-bind="rsvp.att.no"></span></div>
          <div><b id="s-maybe">0</b><span data-bind="rsvp.att.maybe"></span></div>
        </div>
        <div class="wlist" id="wlist" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <section id="close" data-surface="close" aria-label="Penutup">
    <div class="art" id="close-art" aria-hidden="true"></div>
    <div class="wrap close-in">
      <p data-rise data-bind="closing.text"></p>
      <h2 class="display" data-split data-rich data-bind="closing.title"></h2>
      <div class="hash" data-rise data-bind="couple.hashtag"></div>
      <div class="actions" data-rise style="justify-content:center;margin-top:0"><a class="btn" id="wa" target="_blank" rel="noopener" href="#" data-bind="closing.share"></a></div>
      <div class="foot" data-rise id="foot"></div>
    </div>
  </section>
</main>

  motif:`<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88"><g fill="none" stroke="#000" stroke-width="1.4"><ellipse cx="44" cy="22" rx="10" ry="20"/><ellipse cx="44" cy="66" rx="10" ry="20"/><ellipse cx="22" cy="44" rx="20" ry="10"/><ellipse cx="66" cy="44" rx="20" ry="10"/></g></svg>`,
  photos:[["#e8c98a","#a8622a","#2a1a0f"],["#cdb98a","#6b5a2a","#241a0c"],["#e9d3b0","#8c3a14","#2a1a0f"],["#b9c0d8","#3b4a7a","#141c36"],["#f0d9a8","#b5842f","#2a1a0f"],["#d9b48a","#7a3a1c","#1f1109"]],
  css:`.med{width:100%;height:100%}`,
  art:{
    hero:`<div class="layer" data-rot="-10,24" style="inset:0;margin:auto;width:min(120vh,140vw);height:min(120vh,140vw);opacity:.38">${_med()}</div>
      <svg class="layer" data-y="40,0" viewBox="0 0 300 500" preserveAspectRatio="xMidYMax meet" style="inset:auto 0 0 0;margin-inline:auto;width:min(60vw,500px);height:64vh">
        <path d="M150 4 C172 92 252 150 264 262 C276 384 232 470 150 498 C68 470 24 384 36 262 C48 150 128 92 150 4Z" fill="#150c06" stroke="#d9ac55" stroke-width="1.5"/>
        <path d="M150 40 C166 108 226 160 236 262 C246 360 214 440 150 464 C86 440 54 360 64 262 C74 160 134 108 150 40Z" fill="none" stroke="#d9ac55" stroke-opacity=".5"/>
        <path d="M150 90 V470" stroke="#d9ac55" stroke-opacity=".6"/>
        <g stroke="#d9ac55" stroke-opacity=".6" fill="none"><path d="M150 190 q-34 -6 -50 -34 M150 190 q34 -6 50 -34 M150 270 q-44 -8 -64 -44 M150 270 q44 -8 64 -44 M150 350 q-48 -8 -70 -48 M150 350 q48 -8 70 -48"/></g>
        <circle cx="150" cy="132" r="5" fill="#d9ac55"/>
      </svg>
      <svg class="layer" data-x="-22,0" viewBox="0 0 300 200" preserveAspectRatio="xMinYMax meet" style="inset:auto auto 0 0;width:36vw;height:34vh"><path d="M0 200 V120 L40 120 L70 70 L120 70 L150 28 L210 28 L240 70 L300 70 V200Z" fill="#150c06"/><path d="M0 120 H300 M40 120 L70 70 M240 70 L300 120" stroke="#d9ac55" stroke-opacity=".35" fill="none"/></svg>
      <svg class="layer" data-x="22,0" viewBox="0 0 300 200" preserveAspectRatio="xMaxYMax meet" style="inset:auto 0 0 auto;width:36vw;height:34vh;transform:scaleX(-1)"><path d="M0 200 V120 L40 120 L70 70 L120 70 L150 28 L210 28 L240 70 L300 70 V200Z" fill="#150c06"/><path d="M0 120 H300 M40 120 L70 70 M240 70 L300 120" stroke="#d9ac55" stroke-opacity=".35" fill="none"/></svg>`,
    close:`<div class="layer" data-rot="0,40" data-scale=".8,1" style="inset:0;margin:auto;width:min(110vh,120vw);height:min(110vh,120vw);opacity:.3">${_med()}</div>`

/* ---------- BALI: candi bentar, hijau tua, emas ---------- */
bali:{

         display:'"Gilda Display",Georgia,"Times New Roman",serif',body:'"Mulish",system-ui,-apple-system,"Segoe UI",sans-serif'},

      <svg class="layer" data-x="0,-92" viewBox="0 0 100 500" preserveAspectRatio="none" style="inset:auto auto 0 50%;margin-left:calc(var(--gw,min(34vw,420px))*-1);width:var(--gw,min(34vw,420px));height:88vh"><path class="gate-half" d="M100 500V0H88V14H76V30H62V50H48V76H34V108H20V150H0V500Z"/><path d="M0 150H100M20 108H100M34 76H100M48 50H100M62 30H100M76 14H100" stroke="#e2b24c" stroke-opacity=".28" stroke-width=".6" fill="none" vector-effect="non-scaling-stroke"/></svg>
      <svg class="layer" data-x="0,92" viewBox="0 0 100 500" preserveAspectRatio="none" style="inset:auto auto 0 50%;width:var(--gw,min(34vw,420px));height:88vh;transform:scaleX(-1)"><path class="gate-half" d="M100 500V0H88V14H76V30H62V50H48V76H34V108H20V150H0V500Z"/><path d="M0 150H100M20 108H100M34 76H100M48 50H100M62 30H100M76 14H100" stroke="#e2b24c" stroke-opacity=".28" stroke-width=".6" fill="none" vector-effect="non-scaling-stroke"/></svg>`,

<!-- ============================ 3. SCAFFOLD ============================ -->
<script>
  (function(){
  "use strict";
  // Hardened $ and $$ that accept either a DOM element OR a CSS string for scope (r)
    const $ = (s, r = document) => {
        const scope = typeof r === "string" ? document.querySelector(r) : r;
        return scope && typeof scope.querySelector === "function" ? scope.querySelector(s) : null;
    };
    
    const $$ = (s, r = document) => {
        const scope = typeof r === "string" ? document.querySelector(r) : r;
        if (!scope || typeof scope.querySelectorAll !== "function") return [];
        return [...scope.querySelectorAll(s)];
    };

    const root = document.documentElement;
    const C = typeof INVITATION !== "undefined" ? INVITATION : {};
    const reduceMQ = window.matchMedia("(prefers-reduced-motion: reduce)");
    const get = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
    const pad = n => String(n).padStart(2, "0");

    if (typeof gsap !== "undefined" && typeof ScrollTrigger !== "undefined") {
        gsap.registerPlugin(ScrollTrigger);
        ScrollTrigger.config({ignoreMobileResize:true});
    }

  /* ---------- pick + apply theme ---------- */
  const params=new URLSearchParams(location.search);
  const T=THEMES[params.get("theme")]||THEMES[C.theme]||THEMES.fajar;
  root.dataset.theme=T.id;
  (function applyTheme(){
    if(T.fonts.href){const l=document.createElement("link");l.rel="stylesheet";l.href=T.fonts.href;document.head.appendChild(l)}
    const s=root.style;
    s.setProperty("--display",T.fonts.display);s.setProperty("--body",T.fonts.body);
    Object.entries(T.tokens).forEach(([k,v])=>s.setProperty(k,v));
    s.setProperty("--motif",`url("data:image/svg+xml,${encodeURIComponent(T.motif)}")`);
    $("#theme-css").textContent=T.css||"";
    $("#hero-art").innerHTML=T.art.hero;      // trusted theme markup
    $("#close-art").innerHTML=T.art.close;
  })();

  /* ---------- guest name (textContent only) ---------- */
  const guestParam=params.get("to"); if(guestParam)C.gate.guest=guestParam.slice(0,60);

  /* ---------- bind content ---------- */
  function rich(el,str){
    el.textContent="";
    str.split("*").forEach((part,i)=>{
      if(!part)return;
      const host=i%2?el.appendChild(document.createElement("em")):el;
      part.split("\n").forEach((line,j)=>{if(j)host.appendChild(document.createElement("br"));if(line)host.appendChild(document.createTextNode(line))});
    });
  }
  $$("[data-bind]").forEach(el=>{const v=get(C,el.dataset.bind);if(v==null)return;el.hasAttribute("data-rich")?rich(el,String(v)):(el.textContent=v)});
  $$("[data-bind-attr]").forEach(el=>el.dataset.bindAttr.split(";").forEach(pair=>{const [a,p]=pair.split(":");const v=get(C,p);if(v!=null)el.setAttribute(a,v)}));
  $("#mark").textContent=C.couple.a.first[0]+" & "+C.couple.b.first[0];
  $("#foot").textContent="Tema "+T.name;
  document.title=C.couple.a.first+" & "+C.couple.b.first+" — "+C.gate.eyebrow;
  $(".hero-names").setAttribute("aria-label",C.couple.a.first+" "+C.hero.joiner+" "+C.couple.b.first);

  const h=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};

  /* story panels */
  C.story.items.forEach(it=>{
    const p=h("article","panel");p.append(h("span","node"),h("div","yr",it.year),h("h3",null,it.title),h("p",null,it.text));
    p.children[1].setAttribute("aria-hidden","true");$("#panels").appendChild(p);
  });
  /* event cards */
  C.event.items.forEach(it=>{
    const a=h("article","ecard");a.setAttribute("data-rise","");
    const t=h("div","time",it.time);t.appendChild(h("small",null,it.suffix));
    a.append(h("span","tag",it.tag),t,h("p",null,it.text));$("#cards").appendChild(a);
  });
  /* gallery: 3 columns, round robin */
  const photoPal=i=>T.photos[i%T.photos.length];
  function scene(i,kind){
    const [a,b,c]=photoPal(i),id="g"+kind+i;let fig="";
    if(kind==="bust")fig=`<g fill="${c}"><circle cx="150" cy="190" r="44"/><path d="M52 400 C56 296 100 258 150 258 S244 296 248 400Z"/></g>`;
    else if(i%3===0)fig=`<g fill="${c}"><circle cx="132" cy="236" r="11"/><path d="M116 336 Q118 256 132 250 Q146 256 148 336Z"/><circle cx="168" cy="230" r="11"/><path d="M152 336 Q154 250 168 244 Q182 250 184 336Z"/></g>`;
    else if(i%3===1)fig=[70,130,190,240].map((x,k)=>`<path d="M${x} 400 V${250-k*14}" stroke="${c}" stroke-width="3"/><circle cx="${x}" cy="${244-k*14}" r="${14+k*2}" fill="${c}" opacity=".9"/>`).join("");
    else fig=[80,150,220].map((x,k)=>`<path d="M${x} 60 V${120+k*18}" stroke="${c}" stroke-width="2" opacity=".5"/><ellipse cx="${x}" cy="${150+k*18}" rx="18" ry="26" fill="${c}" opacity=".85"/>`).join("");
    return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="300" height="400" fill="url(#${id})"/><circle cx="${90+(i*53)%130}" cy="${100+(i*29)%70}" r="${44+(i%3)*9}" fill="#fff" opacity=".5"/><path d="M0 300 Q80 ${250+i*6} 160 290 T300 270 V400 H0Z" fill="${c}" opacity=".3"/>${kind==="bust"?"":`<path d="M0 340 Q100 300 200 335 T300 320 V400 H0Z" fill="${c}"/>`}${fig}</svg>`;
  }
  const SPEEDS=[-6,8,-4], cols=[0,1,2].map(i=>{const c=h("div","gcol");c.dataset.speed=SPEEDS[i];$("#gal").appendChild(c);return c});
  C.gallery.items.forEach((cap,i)=>{
    const f=h("figure","frame"+(i%2?"":" alt")+(Math.floor(i/3)%2?"":" tall"));
    const ph=h("div","photo");ph.dataset.scene=i;ph.insertAdjacentHTML("afterbegin",scene(i,"s"));
    const fc=h("figcaption");fc.append(h("span",null,"No. "+pad(i+1)),h("span",null,cap));
    f.append(ph,fc);cols[i%3].appendChild(f);
  });
  $$("[data-portrait]").forEach(el=>el.insertAdjacentHTML("afterbegin",scene(+el.dataset.portrait+1,"bust")));
  /* rsvp counts */
  C.rsvp.counts.forEach((t,i)=>{const o=h("option",null,t);o.value=i+1;$("#f-count").appendChild(o)});

  /* ---------- split text ---------- */
  function splitNodes(el,keepRich){
    el.setAttribute("aria-label",el.textContent.replace(/\s+/g," ").trim());
    const out=document.createDocumentFragment();
    (function walk(node,host){
      node.childNodes.forEach(n=>{
        if(n.nodeType===3){
          n.textContent.split(/(\s+)/).forEach(tok=>{
            if(!tok)return;
            if(/^\s+$/.test(tok)){host.appendChild(document.createTextNode(" "));return}
            const w=h("span","w");w.setAttribute("aria-hidden","true");
            [...tok].forEach(ch=>w.appendChild(h("span","c",ch)));host.appendChild(w);
          });
        }else if(n.nodeName==="EM"&&keepRich){const em=document.createElement("em");walk(n,em);host.appendChild(em)}
        else if(n.nodeName==="BR")host.appendChild(document.createElement("br"));
      });
    })(el,out);
    el.textContent="";el.appendChild(out);
  }
  $$("[data-split]").forEach(el=>splitNodes(el,true));
  $$('[data-hero="split"]').forEach(el=>splitNodes(el,false));

  /* ---------- surfaces: colour follows the section in view ---------- */
  const NAV=C.nav, SECTIONS=["hero","couple","story","event","place","gallery","rsvp","close"];
  const cur={name:"hero",...T.surfaces.hero};
  const meta=$('meta[name="theme-color"]');
  const paint=()=>{const s=root.style;s.setProperty("--bg",cur.bg);s.setProperty("--ink",cur.ink);s.setProperty("--accent",cur.accent)};
  paint();$("#sec-n").textContent=NAV[0];
  let surfTween,shown=cur.bg;
  function setSurface(id,instant){
    const m=T.surfaces[id];if(!m)return;
    const i=SECTIONS.indexOf(id);
    $("#sec-i").textContent=pad(i+1);$("#sec-n").textContent=NAV[i]||"";
    if(cur.name===id)return;
    cur.name=id;
    // Only the page background fades per frame; the :root vars (which restyle the whole tree) flip once at the midpoint.
    const from=shown,p={v:0},flip=()=>{cur.bg=m.bg;cur.ink=m.ink;cur.accent=m.accent;paint()};
    let flipped=false;
    surfTween&&surfTween.kill();
    if(instant){shown=m.bg;document.body.style.backgroundColor=shown;flip();meta&&meta.setAttribute("content",m.bg);return}
    surfTween=gsap.to(p,{v:1,duration:.8,ease:"power2.inOut",
      onUpdate(){shown=gsap.utils.interpolate(from,m.bg,p.v);document.body.style.backgroundColor=shown;if(!flipped&&p.v>=.5){flipped=true;flip()}},
      onComplete(){shown=m.bg;document.body.style.backgroundColor=shown;flip();meta&&meta.setAttribute("content",m.bg)}});
  }
  const surfaceTrigger=(el,reduced)=>ScrollTrigger.create({trigger:el,start:"top 55%",end:"bottom 55%",onToggle:s=>{if(s.isActive)setSurface(el.dataset.surface,reduced)}});

  /* ---------- theme art: generic data-* driven layers ---------- */
  const AX=[["y","yPercent"],["x","xPercent"],["scale","scale"],["rot","rotation"]];
  function artEach(scope,fn){$$(".layer",scope).forEach(el=>{const from={},to={};AX.forEach(([a,p])=>{if(el.dataset[a]){const [f,t]=el.dataset[a].split(",").map(Number);from[p]=f;to[p]=t}});if(Object.keys(to).length)fn(el,from,to)})}
  const artScrub=(tl,scope)=>artEach(scope,(el,from,to)=>{gsap.set(el,from);tl.to(el,{...to,ease:"none"},0)});
  const artFinal=scope=>artEach(scope,(el,from,to)=>gsap.set(el,to));

  /* ---------- gate ---------- */
  root.classList.add("locked");$("#top").inert=true;
  let heroIntro=()=>{};
  $("#open").addEventListener("click",()=>{
    const gate=$("#gate");
    const done=()=>{gate.style.display="none";$("#top").inert=false;root.classList.remove("locked");ScrollTrigger.refresh();heroIntro()};
    if(reduceMQ.matches){done();return}
    gsap.timeline({defaults:{ease:"power4.inOut"},onComplete:done})
      .to(".gate-in",{y:-30,autoAlpha:0,duration:.6,ease:"power2.in"})
      .to(".gate .door.l",{xPercent:-100,duration:1.3},.35)
      .to(".gate .door.r",{xPercent:100,duration:1.3},.35);
  });
  $("#open").focus({preventScroll:true});

  /* ---------- build in page order ---------- */
  const mm=gsap.matchMedia();
  mm.add({ok:"(prefers-reduced-motion: no-preference)",reduce:"(prefers-reduced-motion: reduce)"},ctx=>{
    const reduced=!!ctx.conditions.reduce, S=id=>document.getElementById(id);

    ScrollTrigger.create({trigger:document.body,start:"top top",end:"bottom bottom",onUpdate:s=>{$("#bar").style.transform=`scaleX(${s.progress})`}});

    /* hero */
    const hero=S("hero");surfaceTrigger(hero,reduced);
    if(!reduced){
      gsap.set(".hero-names .c",{yPercent:115});
      gsap.set(['[data-hero="fade"]',"#hero-date"],{autoAlpha:0,y:16});
      gsap.set("#hero-art",{autoAlpha:0});
      heroIntro=()=>{
        gsap.timeline({defaults:{ease:"power4.out"}})
          .to("#hero-art",{autoAlpha:1,duration:1.6,ease:"power2.out"},0)
          .to(".hero-top",{autoAlpha:1,y:0,duration:1.2},.1)
          .to(".hero-names .row.a .c",{yPercent:0,duration:1.5,stagger:.05},.2)
          .to(".hero-names .row.amp .c",{yPercent:0,duration:1.2},.7)
          .to(".hero-names .row.b .c",{yPercent:0,duration:1.5,stagger:.06},.55)
          .to(".cue",{autoAlpha:1,y:0,duration:1},1.6);
      };
      const tl=gsap.timeline({scrollTrigger:{trigger:hero,start:"top top",end:"+=95%",pin:true,scrub:.7}});
      artScrub(tl,"#hero-art");
      tl.to(".hero-names",{yPercent:-10,ease:"none"},0)
        .to("#hero-date",{autoAlpha:1,y:0,ease:"none",duration:.4},.35)
        .to(".cue",{autoAlpha:0,duration:.2},0);
    }else artFinal("#hero-art");

    /* couple */
    surfaceTrigger(S("couple"),reduced);
    if(!reduced){
      const tr={trigger:".pair",start:"top 85%",end:"top 25%",scrub:1};
      gsap.from(".p-left",{xPercent:-35,rotate:-5,autoAlpha:0,ease:"none",scrollTrigger:tr});
      gsap.from(".p-right",{xPercent:35,rotate:5,autoAlpha:0,ease:"none",scrollTrigger:tr});
      gsap.fromTo("#bond-path",{strokeDashoffset:1},{strokeDashoffset:0,ease:"none",scrollTrigger:{trigger:".pair",start:"top 60%",end:"top 5%",scrub:1}});
    }

    /* story */
    const story=S("story");surfaceTrigger(story,reduced);
    if(!reduced){
      const track=S("track"),fill=S("line-fill"),panels=$$(".panel",track);let offs=[];
      const dist=()=>Math.max(0,track.scrollWidth-innerWidth);
      gsap.to(track,{x:()=>-dist(),ease:"none",scrollTrigger:{trigger:story,start:"top top",end:()=>"+="+(dist()+innerHeight*.4),pin:true,scrub:.8,invalidateOnRefresh:true,onRefresh:()=>{offs=panels.map(p=>p.offsetLeft)},
        onUpdate:s=>{const W=track.scrollWidth,front=(s.progress*dist()+innerWidth*.55)/W;
          fill.style.transform=`scaleX(${Math.min(1,front)})`;
          panels.forEach((p,i)=>p.classList.toggle("on",offs[i]+9<front*W))}}});
    }

    /* event */
    surfaceTrigger(S("event"),reduced);
    if(!reduced)gsap.from(".count div",{yPercent:30,autoAlpha:0,stagger:.1,duration:1,ease:"power3.out",scrollTrigger:{trigger:"#count",start:"top 88%",once:true}});

    /* place */
    surfaceTrigger(S("place"),reduced);
    if(!reduced){
      gsap.set("#pin",{autoAlpha:0});
      gsap.timeline({scrollTrigger:{trigger:".map",start:"top 80%",end:"bottom 55%",scrub:1}})
        .fromTo("#route",{strokeDashoffset:1},{strokeDashoffset:0,ease:"none",duration:1})
        .fromTo("#pin",{autoAlpha:0,y:-50},{autoAlpha:1,y:0,ease:"bounce.out",duration:.35},.95);
      const ring=gsap.fromTo("#ring",{attr:{r:12},opacity:.8},{attr:{r:46},opacity:0,duration:2,repeat:-1,ease:"power1.out",paused:true});
      ScrollTrigger.create({trigger:".map",onToggle:s=>s.isActive?ring.play():ring.pause()});
    }

    /* gallery */
    surfaceTrigger(S("gallery"),reduced);
    if(!reduced){
      $$(".gcol").forEach(col=>gsap.to(col,{yPercent:+col.dataset.speed,ease:"none",scrollTrigger:{trigger:"#gal",start:"top bottom",end:"bottom top",scrub:true}}));
      gsap.set(".frame .photo",{clipPath:"inset(100% 0% 0% 0%)"});
      ScrollTrigger.batch(".frame .photo",{start:"top 92%",once:true,onEnter:els=>gsap.to(els,{clipPath:"inset(0% 0% 0% 0%)",duration:1.3,ease:"power4.out",stagger:.12,
        onComplete:()=>els.forEach(e=>e.style.clipPath="")})});
    }

    /* rsvp + close */
    surfaceTrigger(S("rsvp"),reduced);surfaceTrigger(S("close"),reduced);
    if(!reduced){
      const tl=gsap.timeline({scrollTrigger:{trigger:"#close",start:"top bottom",end:"bottom bottom",scrub:1}});
      artScrub(tl,"#close-art");
    }else artFinal("#close-art");

    /* shared reveals */
    if(!reduced){
      $$("[data-split]").forEach(el=>gsap.from($$(".c",el),{yPercent:115,duration:1.2,stagger:.02,ease:"power4.out",scrollTrigger:{trigger:el,start:"top 86%",once:true}}));
      const rise=$$("[data-rise]");gsap.set(rise,{autoAlpha:0,y:36});
      ScrollTrigger.batch(rise,{start:"top 92%",once:true,onEnter:els=>gsap.to(els,{autoAlpha:1,y:0,duration:1.1,stagger:.1,ease:"power3.out",overwrite:true})});
    }
  });

  /* ---------- countdown ---------- */
  (function(){
    const t=new Date(C.date.start).getTime(),d=$("#cd-d"),hh=$("#cd-h"),m=$("#cd-m"),s=$("#cd-s");
    const tick=()=>{const x=Math.floor(Math.max(0,t-Date.now())/1000);
      d.textContent=pad(Math.floor(x/86400));hh.textContent=pad(Math.floor(x%86400/3600));m.textContent=pad(Math.floor(x%3600/60));s.textContent=pad(x%60)};
    tick();setInterval(tick,1000);
  })();

  /* ---------- calendar, maps, share ---------- */
  $("#ics").addEventListener("click",()=>{
    const f=v=>new Date(v).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
    const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Undangan//ID","BEGIN:VEVENT","UID:"+f(C.date.start)+"@undangan","DTSTAMP:"+f(new Date()),
      "DTSTART:"+f(C.date.start),"DTEND:"+f(C.date.end),"SUMMARY:"+C.event.calTitle,"LOCATION:"+C.place.query.replace(/,/g,"\\,"),"END:VEVENT","END:VCALENDAR"].join("\r\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="undangan.ics";
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
  $("#maps").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(C.place.query);
  $("#copy").addEventListener("click",async()=>{
    const out=$("#copied");
    try{await navigator.clipboard.writeText(C.place.query);out.textContent=C.place.copied}catch(e){out.textContent=C.place.query}
    setTimeout(()=>out.textContent="",3500);
  });
  $("#wa").href="https://wa.me/?text="+encodeURIComponent(C.closing.shareText+" "+location.href.split("?")[0]);

  /* ---------- RSVP + wishes (demo: browser storage only, wire to your backend) ---------- */
  (function(){
    const KEY="undangan-rsvp-"+C.couple.hashtag, form=$("#rsvp-form"), list=$("#wlist"), err=$("#err"), R=C.rsvp;
    let items=C.wishes.slice();
    try{const saved=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(saved))items=saved.concat(items)}catch(e){}
    const card=i=>{const w=h("div","wish"),b=h("b"),p=h("p",null,i.m);b.append(h("span",null,i.n),h("em",null,R.att[i.a]||""));w.append(b);if(i.m)w.append(p);return w};
    function render(){list.textContent="";items.forEach(i=>list.appendChild(card(i)));
      $("#s-yes").textContent=items.filter(i=>i.a==="yes").reduce((a,i)=>a+(i.g||1),0);
      $("#s-no").textContent=items.filter(i=>i.a==="no").length;
      $("#s-maybe").textContent=items.filter(i=>i.a==="maybe").length}
    render();
    form.addEventListener("change",e=>{if(e.target.name==="att")$("#guest-field").style.display=e.target.value==="yes"?"":"none"});
    let last=0;
    form.addEventListener("submit",e=>{
      e.preventDefault();err.textContent="";
      const name=form.name.value.trim(),att=form.att.value||"",msg=form.msg.value.trim();
      if(name.length<2){err.textContent=R.errName;form.name.focus();return}
      if(!att){err.textContent=R.errAtt;return}
      if(Date.now()-last<8000){err.textContent=R.errWait;return}
      last=Date.now();
      if(!form.website.value){ // honeypot empty
        const rec={n:name.slice(0,60),a:att,m:msg.slice(0,280),g:att==="yes"?parseInt(form.count.value,10)||1:0};
        items.unshift(rec);
        try{const saved=JSON.parse(localStorage.getItem(KEY)||"[]");saved.unshift(rec);localStorage.setItem(KEY,JSON.stringify(saved.slice(0,50)))}catch(e){}
        render();
      }
      $("#t-name").textContent=name.split(" ")[0];
      $("#t-text").textContent=att==="yes"?R.tYes:att==="no"?R.tNo:R.tMaybe;
      form.style.display="none";const th=$("#thanks");th.style.display="grid";th.tabIndex=-1;th.focus({preventScroll:true});
      if(!reduceMQ.matches){gsap.from(th,{y:24,autoAlpha:0,duration:.9,ease:"power3.out"});gsap.from(list.firstChild,{y:-16,autoAlpha:0,duration:.8,delay:.2,ease:"power3.out"})}
      ScrollTrigger.refresh();
    });
  })();

  /* ---------- theme dock (?dock) ---------- */
  if(params.has("dock")){
    const d=h("nav","dock");d.setAttribute("aria-label","Tema");
    Object.values(THEMES).forEach(t=>{const p=new URLSearchParams(location.search);p.set("theme",t.id);
      const a=h("a",null,t.name);a.href="?"+p;if(t.id===T.id)a.setAttribute("aria-current","true");d.appendChild(a)});
    document.body.appendChild(d);
  }

  (document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>ScrollTrigger.refresh());
  })();
</script>
</body>
</html>
